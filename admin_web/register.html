<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmer Registration — Setu Smart Sericulture Platform</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3.3">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    .hidden { display: none !important; }
    body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="auth-body">
  <div class="auth-wrapper">
    <div class="auth-card" style="max-width: 620px;">
      <div class="auth-brand-header">
        <div class="auth-logo-wrap">
          <img src="assets/logo.png" alt="Setu Logo" class="auth-logo-img">
        </div>
        <div class="auth-brand-badge">
          <i data-lucide="sprout"></i>
          <span>FARMER REGISTRATION</span>
        </div>
      </div>

      <h2>Register as a Farmer</h2>
      <p class="auth-subtitle">Join the Setu sericulture network for automated rearing shed climate regulation and IoT telemetry.</p>

      <form id="farmerRegisterForm" onsubmit="handleFarmerRegister(event)">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div class="form-group">
            <label for="regFullName"><i data-lucide="user"></i> Full Name *</label>
            <input type="text" id="regFullName" placeholder="e.g. Ramesh Gowda" required autocomplete="name">
          </div>

          <div class="form-group">
            <label for="regPhone"><i data-lucide="phone"></i> Mobile Number *</label>
            <input type="tel" id="regPhone" placeholder="e.g. 9845012345" required autocomplete="tel">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div class="form-group">
            <label for="regFarmName"><i data-lucide="home"></i> Farm / Shed Name *</label>
            <input type="text" id="regFarmName" placeholder="e.g. Green Valley Farm Shed 1" required>
          </div>

          <div class="form-group">
            <label for="regRegion"><i data-lucide="map-pin"></i> State / Silk Belt *</label>
            <select id="regRegion" required style="width: 100%; height: 42px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 0 10px; font-family: inherit; font-size: 0.85rem; background: var(--bg-surface); color: var(--text-main);">
              <option value="" disabled selected>Select State / Region</option>
              <option value="Karnataka (Mysuru Belt)">Karnataka (Mysuru Silk Belt)</option>
              <option value="Karnataka (Kolar Belt)">Karnataka (Kolar Silk Belt)</option>
              <option value="Karnataka (Ramanagara Belt)">Karnataka (Ramanagara Silk Hub)</option>
              <option value="Andhra Pradesh (Anantapur)">Andhra Pradesh (Anantapur)</option>
              <option value="Andhra Pradesh (Chittoor)">Andhra Pradesh (Chittoor)</option>
              <option value="Tamil Nadu (Dharmapuri)">Tamil Nadu (Dharmapuri)</option>
              <option value="Tamil Nadu (Salem)">Tamil Nadu (Salem)</option>
              <option value="West Bengal (Malda)">West Bengal (Malda)</option>
              <option value="Assam (Muga / Eri)">Assam (Muga / Eri Zone)</option>
              <option value="Jammu & Kashmir">Jammu &amp; Kashmir</option>
              <option value="Other Sericulture Zone">Other Sericulture Zone</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div class="form-group">
            <label for="regPassword"><i data-lucide="key"></i> Create Password *</label>
            <div class="password-input-wrapper">
              <input type="password" id="regPassword" placeholder="Minimum 8 characters" required minlength="8" autocomplete="new-password">
              <button type="button" class="btn-toggle-password" onclick="toggleRegPassword('regPassword', 'regEyeIcon1')" title="Toggle visibility" aria-label="Toggle password visibility">
                <i data-lucide="eye" id="regEyeIcon1"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="regConfirmPassword"><i data-lucide="check-circle-2"></i> Confirm Password *</label>
            <div class="password-input-wrapper">
              <input type="password" id="regConfirmPassword" placeholder="Re-enter password" required minlength="8" autocomplete="new-password">
              <button type="button" class="btn-toggle-password" onclick="toggleRegPassword('regConfirmPassword', 'regEyeIcon2')" title="Toggle visibility" aria-label="Toggle password visibility">
                <i data-lucide="eye" id="regEyeIcon2"></i>
              </button>
            </div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div class="form-group">
            <label for="regDfl"><i data-lucide="package"></i> Batch DFL Capacity</label>
            <input type="text" id="regDfl" placeholder="e.g. 200 DFL" value="200 DFL">
          </div>

          <div class="form-group">
            <label for="regBreed"><i data-lucide="dna"></i> Silkworm Breed</label>
            <select id="regBreed" style="width: 100%; height: 42px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 0 10px; font-family: inherit; font-size: 0.85rem; background: var(--bg-surface); color: var(--text-main);">
              <option value="Double Hybrid (FC1 x FC2)" selected>Double Hybrid (FC1 x FC2) - Bivoltine</option>
              <option value="Cross Breed (PM x CSR2)">Cross Breed (PM x CSR2) - Multi x Bi</option>
              <option value="Pure Mysore (PM)">Pure Mysore (PM)</option>
              <option value="CSR2 x CSR4">CSR2 x CSR4 - Bivoltine White</option>
            </select>
          </div>
        </div>

        <div style="margin: 16px 0;">
          <label style="display: flex; align-items: flex-start; gap: 8px; font-size: 0.82rem; color: var(--text-secondary); cursor: pointer; line-height: 1.45;">
            <input type="checkbox" id="regTerms" required style="margin-top: 3px; accent-color: var(--brand-primary); width: 16px; height: 16px;">
            <span>I acknowledge and agree to the Setu Terms of Service and Privacy Notice for IoT microclimate data telemetry and automated rearing shed control.</span>
          </label>
        </div>

        <div id="regError" class="alert-box error hidden"></div>
        <div id="regSuccess" class="alert-box success hidden"></div>

        <button type="submit" id="regSubmitBtn" class="btn btn-primary btn-full" style="height: 44px;">
          <span>Complete Farmer Registration</span>
          <i data-lucide="arrow-right"></i>
        </button>
      </form>

            <div class="auth-divider">
        <span>OR</span>
      </div>

      <button type="button" class="btn btn-google btn-full" id="googleRegBtn" onclick="handleGoogleRegister()">
        <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <div class="auth-switch-box">
        <span>Already have an account?</span>
        <a href="/login" class="auth-switch-link">Sign In to Setu</a>
      </div>

      <div class="auth-trust-footer">
        <i data-lucide="shield-check"></i>
        <span>Official Setu Sericulture Management Platform · CSRTI Mysuru Grounded</span>
      </div>
    </div>
  </div>

  <script>
    const isLocalHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const API_BASE_URL = isLocalHost ? `${window.location.origin}/api/v1` : 'https://setu-8vh9.onrender.com/api/v1';

    // Per-tab isolated storage
    const TAB_STORAGE = window.sessionStorage;
    let tabId = TAB_STORAGE.getItem('setu_tab_id');
    if (!tabId) {
      tabId = 'tab_' + (window.crypto && crypto.randomUUID ? crypto.randomUUID() : (Math.random().toString(36).substring(2, 9) + Date.now().toString(36)));
      TAB_STORAGE.setItem('setu_tab_id', tabId);
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });

    function toggleRegPassword(fieldId, iconId) {
      const field = document.getElementById(fieldId);
      const icon = document.getElementById(iconId);
      if (!field) return;
      if (field.type === 'password') {
        field.type = 'text';
        if (icon) icon.setAttribute('data-lucide', 'eye-off');
      } else {
        field.type = 'password';
        if (icon) icon.setAttribute('data-lucide', 'eye');
      }
      if (window.lucide) lucide.createIcons();
    }

    async function handleFarmerRegister(e) {
      e.preventDefault();
      const errBox = document.getElementById('regError');
      const succBox = document.getElementById('regSuccess');
      const submitBtn = document.getElementById('regSubmitBtn');

      errBox.classList.add('hidden');
      succBox.classList.add('hidden');

      const fullName = document.getElementById('regFullName').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const emailInput = document.getElementById('regEmail');
      const email = emailInput ? emailInput.value.trim() : '';
      const farmName = document.getElementById('regFarmName').value.trim();
      const region = document.getElementById('regRegion').value;
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;
      const dflCapacity = document.getElementById('regDfl').value.trim() || '200 DFL';
      const breed = document.getElementById('regBreed').value;
      const termsAccepted = document.getElementById('regTerms').checked;

      if (!fullName || !phone || !password) {
        errBox.textContent = 'Please fill out all required fields (Full Name, Mobile Number, Password).';
        errBox.classList.remove('hidden');
        return;
      }

      // Consistent mobile-to-web identification: phone number is primary identifier
      const cleanPhone = phone.replace(/[\s\-]/g, '');
      const username = cleanPhone;

      if (password.length < 8) {
        errBox.textContent = 'Password must be at least 8 characters in length.';
        errBox.classList.remove('hidden');
        return;
      }

      if (password !== confirmPassword) {
        errBox.textContent = 'Passwords do not match. Please re-enter carefully.';
        errBox.classList.remove('hidden');
        return;
      }

      if (!termsAccepted) {
        errBox.textContent = 'You must accept the Terms of Service to register.';
        errBox.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Registering Account...</span>';

      try {
        const payload = {
          full_name: fullName,
          phone: phone,
          username: username,
          email: email || null,
          password: password,
          confirm_password: confirmPassword,
          farm_name: farmName,
          region: region,
          dfl_capacity: dflCapacity,
          breed: breed,
          terms_accepted: true
        };

        const res = await fetch(`${API_BASE_URL}/auth/register`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Tab-ID': tabId
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || 'Registration failed. Please check your details.');
        }

        // Store session credentials in this tab's isolated sessionStorage
        TAB_STORAGE.setItem('setu_tab_token', data.access_token);
        if (data.session_id) TAB_STORAGE.setItem('setu_tab_session_id', data.session_id);
        TAB_STORAGE.setItem('setu_tab_user', JSON.stringify(data.user));
        TAB_STORAGE.setItem('setu_tab_nav', 'live-monitoring');
        if (data.user.shed_id) TAB_STORAGE.setItem('setu_tab_shed', data.user.shed_id);

        const urlParams = new URLSearchParams(window.location.search);
        const redirectParam = urlParams.get('redirect');
        const productIdParam = urlParams.get('product_id') || sessionStorage.getItem('setu_checkout_product_id');

        if (redirectParam === 'checkout' || productIdParam) {
          succBox.textContent = `Welcome, ${data.user.full_name}! Registration successful. Resuming your hardware order...`;
          succBox.classList.remove('hidden');
          localStorage.setItem('setu_token', data.access_token);
          localStorage.setItem('setu_user', JSON.stringify(data.user));
          setTimeout(() => {
            window.location.href = `/#products?buy=${encodeURIComponent(productIdParam || '')}`;
          }, 600);
          return;
        }

        succBox.textContent = `Welcome, ${data.user.full_name}! Your farmer account is registered. Redirecting to your rearing shed dashboard...`;
        succBox.classList.remove('hidden');

        setTimeout(() => {
          window.location.href = '/admin';
        }, 1200);

      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Complete Farmer Registration</span><i data-lucide="arrow-right"></i>';
        if (window.lucide) lucide.createIcons();
      }
    }

    function handleGoogleRegister() {
      const redirectUri = window.location.origin + '/admin/';
      window.location.href = `${API_BASE_URL}/auth/google/login?redirect_url=${encodeURIComponent(redirectUri)}`;
    }

  </script>
</body>
</html>
