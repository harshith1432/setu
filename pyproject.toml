[project]
name = "setu"
version = "0.1.0"
description = "Setu - Smart sericulture environment management and control platform"
readme = "README.md"
authors = [
    { name = "UniqueNIHAL", email = "nihalhu05@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.0.0,<5.0.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.6.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "twilio>=9.12.0",
    "uvicorn>=0.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]

[project.scripts]
setu = "setu:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
