events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with upstream latency tracking
    log_format main_ext '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main_ext buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        application/x-javascript
        text/css
        text/plain
        text/xml
        text/csv;

    # Rate Limiting Zones (Token Bucket)
    # 1. API General Zone: 100 req/sec per IP, burst=50
    limit_req_zone $binary_remote_addr zone=api_general:20m rate=100r/s;
    # 2. IoT Telemetry Ingestion Zone: 500 req/sec per device key / IP, burst=100
    limit_req_zone $http_x_device_key zone=iot_telemetry:30m rate=500r/s;
    # 3. Auth Gate Zone: 10 req/sec per IP to mitigate brute force
    limit_req_zone $binary_remote_addr zone=auth_gate:10m rate=10r/s;

    # Connection Limiting
    limit_conn_zone $binary_remote_addr zone=addr_conn:20m;

    # Upstream Stateless Backend Cluster
    upstream backend_cluster {
        least_conn;
        server backend_1:8000 max_fails=3 fail_timeout=10s;
        server backend_2:8000 max_fails=3 fail_timeout=10s;
        server backend_3:8000 max_fails=3 fail_timeout=10s;
        server backend_4:8000 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 16M;
        limit_conn addr_conn 100;

        # Health & Readiness checks for Load Balancers (AWS ALB, GCP Cloud Armor, K8s Ingress)
        location /health {
            proxy_pass http://backend_cluster/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
        }

        location /ready {
            proxy_pass http://backend_cluster/ready;
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
        }

        location /metrics {
            # Restrict Prometheus scraping to internal VPC or authorized monitoring
            proxy_pass http://backend_cluster/metrics;
            proxy_set_header Host $host;
        }

        # Authentication Routes (Tight Rate Limiting)
        location /api/v1/auth/ {
            limit_req zone=auth_gate burst=20 nodelay;
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # IoT High-Volume Ingestion Routes
        location /api/v1/telemetry/record {
            limit_req zone=iot_telemetry burst=100 nodelay;
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/telemetry/batch {
            limit_req zone=iot_telemetry burst=100 nodelay;
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Real-time Server-Sent Events (SSE) Stream
        location /api/v1/telemetry/sse/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
            chunked_transfer_encoding off;
        }

        # Real-time WebSocket Upstream
        location /ws/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # General REST API
        location /api/ {
            limit_req zone=api_general burst=50 nodelay;
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Admin Web Portal Static UI
        location /admin/ {
            alias /var/www/admin_web/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        # Fallback root
        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
        }
    }
}
